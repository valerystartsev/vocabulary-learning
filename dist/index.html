    <title>Adaptation — Business English Course · A1–A2</title>

    <!-- Splash style: shown until React mounts so the user never sees a blank white page -->
    <style>
      html, body { margin: 0; padding: 0; background: #F4F5F3; }
      #initial-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #F4F5F3;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #initial-splash img {
        width: 96px; height: 96px;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #initial-splash p {
        margin-top: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 13px; color: #79A08C;
        letter-spacing: 0.04em;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.96); }
      }
      #initial-splash.fade-out { opacity: 0; pointer-events: none; }
    </style>
    <script type="module" crossorigin src="/assets/index-RywTIkcK.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C7BXz-U_.css">
  </head>
  <body>
    <div id="initial-splash">
      <img src="/favicon/web-app-manifest-192x192.png" alt="Adaptation" />
      <p>Loading…</p>
    </div>
    <div id="root"></div>
    <script>
      // Hide the splash once React has rendered something into #root.
      const splash = document.getElementById('initial-splash');
      const root = document.getElementById('root');
      const hideSplash = () => {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 400);
      };
      const obs = new MutationObserver(() => {
        if (root.childElementCount > 0) { hideSplash(); obs.disconnect(); }
      });
      obs.observe(root, { childList: true });
      // Safety fallback — never leave the splash for more than 6 s.
      setTimeout(hideSplash, 6000);
    </script>
  </body>
